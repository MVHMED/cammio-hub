<style>
:root{--bg:#F6F6F3;--card:#FFFFFF;--ink:#0B0B0B;--mute:#8A8A85;--line:#E6E6E1;--soft:#EFEFEA;--y:#FFD400;--red:#E5484D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"Inter Tight","IBM Plex Sans Arabic",-apple-system,system-ui,"Segoe UI",Tahoma,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic","Inter Tight",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}
.muted{color:var(--mute)} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13px;white-space:nowrap;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn.y{background:var(--y);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{border-color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:8px}
.btn[disabled],.btn.busy{opacity:.3;pointer-events:none}
.ico{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;position:relative;transition:border-color .15s;flex:none}
.ico:hover{border-color:var(--ink)}
.ico b{position:absolute;top:-3px;inset-inline-end:-3px;background:var(--y);font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.av{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:600;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:64px;height:64px;font-size:22px}
.chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;color:var(--mute)}
.chip.y{background:var(--y);border-color:var(--y);color:var(--ink)}
.chip.k{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.r{border-color:var(--red);color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--y);display:inline-block;flex:none}
.dot.pulse{animation:pulse 2s infinite}

/* signature */
.sig{position:fixed;bottom:12px;right:16px;z-index:5;pointer-events:none;display:flex;align-items:flex-end;gap:2px;direction:ltr;opacity:.85}
.sig small{font-family:"Inter Tight",sans-serif;font-size:10px;color:var(--mute);margin-bottom:9px;animation:sigby 8s ease-in-out infinite}
.sig svg{overflow:visible}
.sig text{font-family:"Mrs Saint Delafield",cursive;font-size:34px;fill:transparent;stroke:var(--ink);stroke-width:.7;stroke-dasharray:700;stroke-dashoffset:700;animation:sig 8s ease-in-out infinite}
@keyframes sig{0%{stroke-dashoffset:700;fill:rgba(11,11,11,0);opacity:1}38%{stroke-dashoffset:0;fill:rgba(11,11,11,0)}50%{fill:rgba(11,11,11,1)}78%{fill:rgba(11,11,11,1);opacity:1;stroke-dashoffset:0}92%{opacity:0;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:700}}
@keyframes sigby{0%,5%{opacity:0}15%,78%{opacity:1}92%,100%{opacity:0}}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;overflow:hidden;position:relative}
.lbox{width:min(340px,100%);position:relative}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:16px;position:relative}
.seg button{padding:10px;border-radius:9px;font-weight:600;color:var(--mute);position:relative;z-index:1;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg i{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);background:var(--card);border-radius:9px;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:inset-inline-start .3s cubic-bezier(.2,.8,.2,1)}
.lform{display:grid;gap:10px}
.lform .btn{padding:13px;margin-top:4px}
.err{color:var(--red);font-size:12px;min-height:18px}
.demo{position:absolute;bottom:18px;inset-inline-start:18px;font-size:11px;color:var(--mute)}
.demo button{text-decoration:underline;color:var(--mute);font-size:11px}
.corner{position:absolute;top:18px;inset-inline-end:18px}
.lines{position:absolute;inset:0;pointer-events:none;opacity:.5}

/* app */
.top{height:60px;display:flex;align-items:center;gap:8px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;transition:border-color .15s}
[dir=rtl] .me{padding:3px 3px 3px 10px}
.me:hover{border-color:var(--ink)}
.main{max-width:980px;margin:0 auto;padding:28px 24px 90px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h1{font-size:22px;font-weight:600;letter-spacing:-.02em}
.tabs{display:flex;gap:2px;background:var(--soft);border-radius:11px;padding:3px;margin-bottom:16px;overflow-x:auto;width:fit-content;max-width:100%}
.tab{padding:7px 13px;border-radius:8px;color:var(--mute);font-weight:500;white-space:nowrap;font-size:13px;display:flex;align-items:center;gap:6px}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tab em{font-style:normal;font-size:10px;background:var(--y);border-radius:8px;padding:0 6px;color:var(--ink)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.it{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;transition:background .15s}
.it:hover{background:#FBFBF9}
.it .t{font-weight:600}
.it .s{font-size:12px;color:var(--mute);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meta{display:flex;align-items:center;gap:8px}
.det{display:none;padding:4px 16px 18px;animation:fade .25s}
.item.open .det{display:block}
.item.open .it{background:#FBFBF9}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.steps{display:flex;gap:3px;margin:6px 0 14px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.steps span.on{background:var(--ink)}
.steps span.cur{background:var(--y)}
.steps span.cur:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:sh 1.6s infinite}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-bottom:14px}
.kv dt{color:var(--mute)}
.kv a{text-decoration:underline;text-underline-offset:3px}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.box.y{border-color:var(--y);background:#FFFBE6}
.rd{display:flex;gap:4px}
.rd i{width:16px;height:4px;border-radius:2px;background:var(--line)}
.rd i.on{background:var(--ink)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.st b{font-size:24px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1.1}
.st span{font-size:12px;color:var(--mute)}
.st.hl b{background:linear-gradient(transparent 62%,var(--y) 62%);display:inline}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--mute)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--card);z-index:50;border-inline-start:1px solid var(--line);transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
[dir=rtl] .sheet{transform:translateX(-105%)}
.sheet.on{transform:none!important}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:600}
.sheet .body{padding:18px;overflow:auto;flex:1;display:grid;gap:14px;align-content:start}
.opt{display:flex;gap:6px;flex-wrap:wrap}
.opt button{border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12px;color:var(--mute)}
.opt button.on{border-color:var(--ink);color:var(--ink);background:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sep{height:1px;background:var(--line);margin:4px 0}
.nt{padding:13px 18px;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px}
.nt:hover{background:#FBFBF9}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:inset 0 0 0 2px var(--y);background:#FFFBE6}100%{box-shadow:none}}
.nt small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:grid;gap:6px;justify-items:center}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:11px 14px;font-size:13px;max-width:340px;display:flex;gap:8px;align-items:center;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.menu{position:absolute;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:5px;min-width:200px;animation:pop .2s}
.menu button{display:flex;width:100%;text-align:start;padding:8px 10px;border-radius:8px;font-size:13px;gap:8px;align-items:center}
.menu button:hover{background:var(--soft)}
.menu button[disabled]{opacity:.35}
.avpick{display:flex;align-items:center;gap:14px}
.avpick label{margin:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.avpick input{display:none}

.tour-ring{position:fixed;z-index:95;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.55),0 0 0 2px var(--y);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tour-tip{position:fixed;z-index:96;background:var(--card);border-radius:14px;padding:16px;width:min(290px,calc(100vw - 32px));box-shadow:0 14px 40px rgba(0,0,0,.2);transition:top .35s cubic-bezier(.2,.8,.2,1),left .35s cubic-bezier(.2,.8,.2,1)}
.tour-tip p{font-size:14px;margin:6px 0 14px}
.tour-block{position:fixed;inset:0;z-index:94}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,212,0,.7)}50%{box-shadow:0 0 0 6px rgba(255,212,0,0)}}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}.main{padding:20px 14px 90px}.top{padding:0 14px}.me .nm{display:none}.me{padding:3px!important}.it .meta .chip.hide-m{display:none}}
</style>

  async addNotes(vid,rows){const base=notesOf(vid).length;rows.forEach((r,i)=>vnotes.push({id:"n"+Math.random().toString(36).slice(2),video:vid,...r,author:S.me,done:false,sort:base+i}));},

  async delNote(id){vnotes=vnotes.filter(x=>x.id!==id);},
  async clearNotes(vid){vnotes=vnotes.filter(x=>x.video!==vid);},
  async createTask(f){tasks.push({id:"t"+Date.now().toString(36),kind:"task",editor:f.editor,title:f.title,notes:f.notes,link:f.link,due:f.due,stages:f.stages,stage:0,isNew:true,upd:Date.now()});},

  async uploadAvatar(file){return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file);});},
  async changePassword(pw){passwords[S.me]=pw;delete creds[S.me];},
  demoPass:u=>passwords[u],
 };

   const r=b.getBoundingClientRect();const m=document.createElement("div");m.className="menu";
   m.innerHTML=x.stages.map((st,i)=>`<button data-a="tStage" data-t="${x.id}" data-s="${i+1}" ${i<x.stage?"disabled":""}><span class="dot" style="background:${i===x.stage?"var(--y)":"var(--line)"}"></span>${esc(st)}</button>`).join("");
   document.body.appendChild(m);const mw=m.offsetWidth;m.style.top=(r.bottom+window.scrollY+6)+"px";m.style.left=Math.max(8,Math.min(window.innerWidth-mw-8,(LANG==="ar"?r.left:r.right-mw)))+"px";return;}
  case "tStage":{const x=T_(b.dataset.t),ns=+b.dataset.s;document.querySelectorAll(".menu").forEach(m=>m.remove());
   if(ns>=x.stages.length){S.finT=x.id;S.sheet="fin";render();return;}
   run(async()=>{await api.updTask(x.id,{stage:ns});const st=x.stages[ns-1]||"";await api.notifyAdmins(`${nm(me)}: ${x.title} ← ${st}${ns>=x.stages.length?" ✓":""}`,`${nm(me)}: ${x.title} → ${st}${ns>=x.stages.length?" ✓":""}`);toast("✓");});return;}
  case "finSend":{const x=T_(S.finT);const lk=(document.getElementById("finLink").value||"").trim();if(lk&&!/^https?:\/\//.test(lk)){toast(t("krockLink"));return;}
   run(async()=>{await api.updTask(x.id,{stage:tTotal(x)===x.stages.length?x.stages.length:1,resLink:lk});await api.notifyAdmins(`${nm(me)} خلّص: ${x.title}${lk?" — "+lk:""}`,`${nm(me)} finished: ${x.title}${lk?" — "+lk:""}`);S.sheet=null;S.finT=null;toast("✓");});return;}
  case "editUser":S.editU=b.dataset.u;S.editRole=null;S.showPw=false;S.delArm=false;S.sheet="user";break;
  case "editRole":S.editRole=b.dataset.r;break;
  case "togglePw":S.showPw=!S.showPw;break;
  case "delUser":if(!S.delArm){S.delArm=true;render();setTimeout(()=>{if(S.delArm){S.delArm=false;render();}},4000);return;}
   S.delArm=false;run(async()=>{await api.deleteUser(b.dataset.u);S.sheet=null;toast(t("deleted"));});return;
  case "copyLogin":{const u=b.dataset.u;const txt=`${location.href.split("#")[0]}\n${LANG==="ar"?"يوزر":"user"}: ${profiles[u].username}${creds[u]?`\n${LANG==="ar"?"باسورد":"password"}: ${creds[u]}`:""}`;
   try{navigator.clipboard.writeText(txt).then(()=>toast(t("copied")),()=>toast(txt.replace(/\n/g," · ")));}catch(_){toast(txt.replace(/\n/g," · "));}return;}
 }
 render();
});

/* ================= NOTIFICATION ROUTING ================= */
function openRef(ref){if(!ref)return;const [k,id]=ref.split(":");const r=role(S.me);let tab=null,open=null;
 if(k==="tab"){tab=id;}
 else if(k==="v"){const v=V(id);if(!v){toast(t("noTasks"));return;}const p=P(v.project);open=id;
  if(r==="admin"){if(p.status==="pending"){S.sec="cl";S.selC=p.client;}else{S.sec="tm";S.selE=p.editor;S.tsub=v.pending?"appr":v.stage===7?"done":"work";}}
  else if(r==="editor")tab=bucket(v);
  else tab=p.status==="pending"?"waiting":(v.pub===7?"delivered":"active");
  if(r==="admin"&&p.status==="pending")open=p.id;}
 if(r==="admin"&&k==="t"){const x=T_(id);S.sec="tm";S.selE=x.editor;S.tsub=tDone(x)?"done":"work";tab=null;}
 if(r==="admin"&&k==="p"){const p=P(id);if(p.status==="pending"){S.sec="cl";S.selC=p.client;}else{S.sec="cl";S.selC=p.client;}tab=null;}
 if(r==="admin"&&k==="tab"){S.sec=id==="req"?"cl":"tm";tab=null;}
 else if(k==="t"){const x=T_(id);if(!x){toast(t("noTasks"));return;}open=id;tab=r==="admin"?null:bucket(x);}
 else if(k==="p"){const p=P(id);if(!p)return;if(r==="admin"){tab=null;open=p.status==="pending"?id:(videos.find(v=>v.project===id)||{}).id;}
  else if(r==="editor"){const v=videos.find(v=>v.project===id&&v.stage<7);if(v){tab=bucket(v);open=v.id;}}
  else{tab=p.status==="pending"?"waiting":"active";open=(videos.find(v=>v.project===id)||{}).id;}}
 S.sheet=null;if(tab)S.tab=tab;S.open=open;render();
 if(open)setTimeout(()=>{const el=document.querySelector(`[data-id="${open}"]`);if(el){const it=el.closest(".item");it.scrollIntoView({behavior:"smooth",block:"center"});it.classList.add("flash");}},60);}
/* ================= TOUR ================= */
let TS=null;
function startTour(){if(!S.me)return;const st=(TOURS[role(S.me)]||[]).filter(([k])=>document.querySelector(`[data-tour="${k}"]`));if(!st.length)return;TS={st,i:0};drawTour();}
function drawTour(){
 const host=document.getElementById("tour");if(!TS){host.innerHTML="";return;}
 const [k,txt]=TS.st[TS.i];const el=document.querySelector(`[data-tour="${k}"]`);if(!el){TS=null;host.innerHTML="";return;}
 el.scrollIntoView({block:"nearest"});const r=el.getBoundingClientRect(),pad=6,last=TS.i===TS.st.length-1;
 host.innerHTML=`<div class="tour-block"></div><div class="tour-ring" style="top:${r.top-pad}px;left:${r.left-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>
 <div class="tour-tip" id="tip"><div class="row tiny muted"><span class="dot"></span>${TS.i+1} / ${TS.st.length}</div><p>${txt[LANG]}</p>
 <div class="row"><button class="tiny muted grow" style="text-align:start" data-tr="skip">${last?"":t("skip")}</button><button class="btn sm ${last?"y":""}" data-tr="next">${last?t("finish"):t("next")}</button></div></div>`;
 const tip=document.getElementById("tip");const tw=tip.offsetWidth,th=tip.offsetHeight;
 let top=r.bottom+14;if(top+th>innerHeight-10)top=r.top-th-14;let left=r.left+r.width/2-tw/2;left=Math.max(12,Math.min(innerWidth-tw-12,left));
 tip.style.top=Math.max(10,top)+"px";tip.style.left=left+"px";
}
document.getElementById("tour").addEventListener("click",e=>{const b=e.target.closest("[data-tr]");if(!b)return;if(b.dataset.tr==="skip"||TS.i===TS.st.length-1)TS=null;else TS.i++;drawTour();});
addEventListener("resize",()=>TS&&drawTour());

/* 3-hour check-in for editors (while the site is open) */
setInterval(()=>{if(S.me&&role(S.me)==="editor"){if(nextChk()===0&&S.sheet!=="chk"){S.sheet="chk";render();toast(t("checkin"));sysNotify(t("checkin"));}else if(!S.sheet&&!TS){const el=document.querySelector('[data-tour="chk"]');if(el)el.lastChild.textContent=`${t("nextIn")} · ${(Math.round(nextChk()/H*10)/10)}${t("h")}`;}}},60000);

window.__initP=(async()=>{try{await api.init();}catch(e){console.error(e);}})();
S.ready=true;render();
window.__initP.then(()=>{if(S.me)render();});
</script>
